<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi Rutina</title>
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1b1c1a;--muted:#6c6b66;--line:#e3e1db;--field:#faf9f6;
  --accent:#1d7a4c;--accent-ink:#ffffff;--accent-soft:#e2f1e8;--rest:#8a8780;--danger:#b23a2a;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121311;--card:#1b1d1a;--ink:#ecebe6;--muted:#9b9a94;--line:#2c2e2a;--field:#222420;
    --accent:#4cc38a;--accent-ink:#0d1a12;--accent-soft:#1c3226;--rest:#77756f;--danger:#e2735f;
  }
}
:root[data-theme="dark"]{
  --bg:#121311;--card:#1b1d1a;--ink:#ecebe6;--muted:#9b9a94;--line:#2c2e2a;--field:#222420;
  --accent:#4cc38a;--accent-ink:#0d1a12;--accent-soft:#1c3226;--rest:#77756f;--danger:#e2735f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:9px 6px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar input[type=date]{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-style:dashed;width:100%;color:var(--muted)}
.icon{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;font-size:18px}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 6px;line-height:1}
.x:hover{color:var(--danger)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.week button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 0 7px;font:inherit;cursor:pointer;position:relative}
.week button small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.week button b{font-size:15px}
.week button.rest small{color:var(--rest)}
.week button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week button.on small{color:var(--accent-ink);opacity:.85}
.week button.done::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.week button.on.done::after{background:var(--accent-ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);font-weight:600}
label.f input{margin-top:3px;font-size:16px;text-align:center}
.daytitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.daytitle span{color:var(--muted);font-size:13px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.exhead b{font-size:14px}
.last{font-size:12px;color:var(--muted);text-align:right}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.otro{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;border-top:1px solid var(--line);padding:12px 0}
.otro:first-child{border-top:0;padding-top:0}
.rest{text-align:center;padding:26px 14px;color:var(--muted)}
.rest b{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}
.weight{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-color:transparent}
.weight div{flex:1}
.weight b{display:block}
.weight small{color:var(--muted)}
.weight input{width:110px;font-size:17px;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--field);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.bar.over i{background:var(--danger)}
.meal{display:grid;grid-template-columns:1fr 84px 70px auto;gap:6px;align-items:center;margin-bottom:6px}
.meal input{padding:7px 8px}
.mealhead{display:grid;grid-template-columns:1fr 84px 70px 30px;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.sub{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.sub h3{margin:0}
.sub span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.hnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hnav b{text-align:center;flex:1}
.hday{border-top:1px solid var(--line);padding:10px 0}
.hday:first-child{border-top:0;padding-top:0}
.hday .top{display:flex;justify-content:space-between;gap:8px}
.hday .top span{color:var(--muted);font-size:13px}
.hday ul{margin:6px 0 0;padding-left:18px}
.hday li{font-size:14px}
.hday li em{color:var(--muted);font-style:normal}
.muted{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase}
.cal .c{aspect-ratio:1;border-radius:9px;background:var(--field);border:1px solid var(--line);font-size:12px;padding:4px;position:relative;cursor:pointer;color:var(--ink);font-family:inherit;text-align:left}
.cal .c.empty{visibility:hidden}
.cal .c.t{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .c .k{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;opacity:.8}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td:not(:first-child),th:not(:first-child){text-align:right}
.tablewrap{overflow-x:auto}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:24px;font-size:13px;color:var(--muted)}
.foot .row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}
.burn{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.burn{grid-template-columns:repeat(4,1fr)}}
.burn .kpi{background:var(--field)}
.burn .kpi.tot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.burn .kpi.tot small{color:var(--accent-ink);opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardio{display:grid;grid-template-columns:1fr 90px auto;gap:6px;align-items:center;margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.pos{color:var(--danger)}
.neg{color:var(--accent)}
.prof label.f{margin-bottom:10px}
.prof label.f input,.prof label.f select{margin-top:3px;text-align:left;font-size:16px}
.tabs button{font-size:14px}
.hright{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.sync.ok{color:var(--accent)}
.sync.err{color:var(--danger)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mi Rutina</h1>
    <div class="hright">
      <span id="syncState" class="sync"></span>
      <select id="unit" style="width:auto" aria-label="Unidad de peso">
        <option value="kg">kg</option>
        <option value="lb">lb</option>
      </select>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="train">Gym</button>
    <button data-view="food">Comidas</button>
    <button data-view="hist">Historial</button>
    <button data-view="perfil">Perfil</button>
  </nav>

  <div id="datebar">
    <div class="datebar">
      <button class="btn icon" data-act="prevDay" aria-label="Día anterior">‹</button>
      <input type="date" id="fecha">
      <button class="btn icon" data-act="nextDay" aria-label="Día siguiente">›</button>
      <button class="btn" data-act="today">Hoy</button>
    </div>
    <div class="week" id="week"></div>
  </div>

  <main id="main"></main>

  <div class="foot">
    <span>Los datos se guardan en este navegador. Haz un respaldo de vez en cuando.</span>
    <div class="row">
      <button class="btn" data-act="export">Exportar respaldo</button>
      <button class="btn" data-act="import">Importar</button>
      <input type="file" id="file" accept="application/json" class="hidden">
    </div>
  </div>
</div>

<script>
/* ---------- Rutina (5 días: Lun, Mar, Mié, Vie, Sáb) ---------- */
const RUTINA = {
  1:{dia:'Día 1', t:'Empujes',  g:[['Pecho',2],['Hombro',2],['Tríceps',2]]},
  2:{dia:'Día 2', t:'Tracción', g:[['Espalda',3],['Bíceps',2],['Abdomen',1]]},
  3:{dia:'Día 3', t:'Pierna',   g:[['Cuádriceps',1,['Extensión de cuádriceps']],['Compuesto',2,['Sentadilla','Prensa']],['Isquiotibiales',1],['Pantorrilla',1]]},
  5:{dia:'Día 4', t:'Torso',    g:[['Pecho',2],['Espalda',2],['Hombro',1],['Bíceps',1],['Tríceps',1]]},
  6:{dia:'Día 5', t:'Pierna',   g:[['Compuesto',1,['Sentadilla hack']],['Cuádriceps',1],['Isquiotibiales',1],['Pantorrilla',1]]}
};
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIEMPOS = ['Desayuno','Almuerzo','Cena','Meriendas'];

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function slots(dow){
  const r = RUTINA[dow]; if(!r) return [];
  const out = [];
  r.g.forEach(([grupo,n,defs])=>{
    for(let i=0;i<n;i++){
      out.push({
        id:`d${dow}-${slug(grupo)}${i+1}`,
        label:`Ejercicio de ${grupo.toLowerCase()}${n>1?' '+(i+1):''}`,
        def:(defs&&defs[i])||''
      });
    }
  });
  return out;
}

/* ---------- Datos ---------- */
const KEY = 'mi-rutina-v1';
/* Perfil vacío: los datos personales viven solo en el repositorio privado */
const PERFIL_BASE = {peso:'', talla:'', grasa:'', edad:'', sexo:'M', act:'1.2'};
function norm(x){
  const s = Object.assign({settings:{unit:'kg',goal:2500},names:{},days:{}}, x||{});
  s.settings = Object.assign({unit:'kg',goal:2500}, s.settings||{});
  s.prof = Object.assign({}, PERFIL_BASE, s.prof||{});
  return s;
}
let S = null;
try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
S = norm(S);

/* Gasto por actividad: MET (Compendio de Actividades Físicas). Se usa MET neto (MET − 1)
   para no contar dos veces el gasto basal, que ya está en las calorías naturales del día. */
const INTENSIDAD = [['3.5','Moderada (descansos largos)'],['5','Intensa (descansos cortos)'],['6','Muy intensa (superseries, poco descanso)']];
const CARDIO = [
  ['3.5','Caminar (5 km/h)'],['6','Caminadora con inclinación'],['5','Elíptica'],['6.8','Bicicleta estática (moderada)'],
  ['7','Trotar'],['9.8','Correr (10 km/h)'],['9','Escaladora'],['7','Remo'],['8','Saltar cuerda']
];
const ACTIVIDAD = [['1.2','Sedentario (trabajo de oficina / computadora)'],['1.375','Ligero (de pie o caminando parte del día)'],['1.55','Moderado (trabajo físico buena parte del día)']];
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} schedulePush(); }
function day(k){ return S.days[k] || (S.days[k] = {ex:{},otros:[],comidas:[],peso:'',notas:''}); }
const get = k => S.days[k];

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const add = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => add(d, -((d.getDay()+6)%7));
const fmt = d => `${d.getDate()} de ${MESES[d.getMonth()]}`;

/* ---------- Utilidades ---------- */
const num = v => { const n = parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:0; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = () => S.settings.unit;
const logged = e => e && (num(e.s)>0 || num(e.r)>0 || num(e.w)>0);
const vol = e => num(e.s)*num(e.r)*num(e.w);
const nf = n => Math.round(n).toLocaleString('es');
function trained(k){ const d=get(k); return !!d && (Object.values(d.ex||{}).some(logged) || (d.otros||[]).some(o=>logged(o)||(o.n||'').trim())); }
function kcal(k){ const d=get(k); return d ? (d.comidas||[]).reduce((a,m)=>a+num(m.c),0) : 0; }
function prot(k){ const d=get(k); return d ? (d.comidas||[]).reduce((a,m)=>a+num(m.p),0) : 0; }
function dayVol(k){ const d=get(k); if(!d) return 0; return Object.values(d.ex||{}).reduce((a,e)=>a+vol(e),0) + (d.otros||[]).reduce((a,e)=>a+vol(e),0); }
function weekWeight(k){ const d=get(iso(monday(parse(k)))); return d && num(d.peso)>0 ? num(d.peso) : null; }
const toKg = v => U()==='lb' ? v*0.45359237 : v;
/* Peso más reciente registrado (lunes) hasta la fecha k; si no hay, el del perfil */
function pesoKg(k){
  const keys = Object.keys(S.days).filter(x=>x<=k && num(S.days[x].peso)>0).sort();
  return keys.length ? toKg(num(S.days[keys.at(-1)].peso)) : num(S.prof.peso);
}
function bmr(k){
  const w=pesoKg(k), bf=num(S.prof.grasa);
  if(bf>0 && bf<70) return 370 + 21.6*w*(1-bf/100);                 // Katch-McArdle (usa masa magra)
  const s = S.prof.sexo==='F' ? -161 : 5;                            // Mifflin-St Jeor
  return 10*w + 6.25*num(S.prof.talla) - 5*num(S.prof.edad) + s;
}
function gymMin(d){
  if(num(d.dur)>0) return num(d.dur);
  const sets = Object.values(d.ex||{}).reduce((a,e)=>a+num(e.s),0) + (d.otros||[]).reduce((a,e)=>a+num(e.s),0);
  return sets ? sets*3 : 0;                                          // estimado: ~3 min por serie con descanso
}
function burn(k){
  const d=get(k)||{}, w=pesoKg(k);
  const base=bmr(k), natural=base*num(S.prof.act||1.2);
  const lifted = Object.values(d.ex||{}).some(logged) || (d.otros||[]).some(logged) || num(d.dur)>0;
  const mins = lifted ? gymMin(d) : 0;
  const pesas = (num(d.int||3.5)-1) * w * mins/60;
  const cardio = (d.cardio||[]).reduce((a,c)=>{ const m=CARDIO[+c.i]; return a + (m? (num(m[0])-1)*w*num(c.m)/60 : 0); },0);
  return {base, natural, pesas, cardio, mins, estMin: lifted && !(num(d.dur)>0), total: natural+pesas+cardio};
}
const setTxt = e => { const p=[]; if(num(e.s)) p.push(num(e.s)+'×'+(num(e.r)||'?')); else if(num(e.r)) p.push(num(e.r)+' reps'); if(num(e.w)) p.push(num(e.w)+' '+U()); return p.join(' · ')||'—'; };
function lastTime(id, k){
  const keys = Object.keys(S.days).filter(x=>x<k).sort().reverse();
  for(const x of keys){ const e=S.days[x].ex&&S.days[x].ex[id]; if(logged(e)) return {k:x,e}; }
  return null;
}

/* ---------- Estado de la vista ---------- */
let cur = iso(new Date());
let view = 'train';
let hmode = 'week';
let href = new Date();
try{ view = localStorage.getItem(KEY+'-view') || 'train'; }catch(e){}

const $ = s => document.querySelector(s);
const main = $('#main');

/* ---------- Sincronización con GitHub (repositorio privado) ---------- */
const SKEY = KEY+'-sync';
const FILE = 'datos.json';
let SY = {}; try{ SY = JSON.parse(localStorage.getItem(SKEY))||{}; }catch(e){}
let pushTimer=null, pushing=false, dirty=false, sha=null, syncTxt='', syncCls='';
function on(){ return !!(SY.token && SY.repo); }
function syncState(t,c){
  syncTxt=t||''; syncCls=c||'';
  const el=$('#syncState'); if(el){ el.textContent=syncTxt; el.className='sync '+syncCls; }
  const m=$('#syncMsg'); if(m){ m.textContent=syncTxt; m.className='sync '+syncCls; }
}
function errTxt(e){
  const c=String(e&&e.message);
  if(c==='401') return 'Token inválido o vencido';
  if(c==='403') return 'Sin permiso: revisa el token';
  if(c==='404') return 'Repositorio no encontrado';
  if(e instanceof TypeError) return 'Sin conexión';
  return 'Error al sincronizar ('+c+')';
}
const b64e = s => { const b=new TextEncoder().encode(s); let x=''; for(let i=0;i<b.length;i+=0x8000) x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(x); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function api(opt={}){
  return fetch(`https://api.github.com/repos/${SY.repo}/contents/${FILE}`, Object.assign({cache:'no-store'}, opt, {
    headers:Object.assign({'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}, opt.headers||{})
  }));
}
async function remoteGet(){
  const r=await api();
  if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status);
  const j=await r.json(); sha=j.sha;
  let txt;
  if(j.encoding==='base64' && j.content) txt=b64d(j.content);
  else { const r2=await api({headers:{'Accept':'application/vnd.github.raw'}}); if(!r2.ok) throw new Error(r2.status); txt=await r2.text(); }
  return JSON.parse(txt);
}
function remotePut(){
  const body={message:'Actualizar datos '+new Date().toISOString(), content:b64e(JSON.stringify(S))};
  if(sha) body.sha=sha;
  return api({method:'PUT', body:JSON.stringify(body)});
}
function adopt(rem){
  S=norm(rem);
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  render();
}
function schedulePush(){
  if(!on()) return;
  dirty=true; syncState('Guardando…');
  clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,1500);
}
async function syncPush(){
  if(!on()) return;
  if(pushing){ dirty=true; return; }
  pushing=true; clearTimeout(pushTimer); dirty=false;
  let ok=true;
  try{
    let r=await remotePut();
    if(r.status===409||r.status===422){                 // otro dispositivo guardó antes
      const rem=await remoteGet();
      if(rem && (rem.updatedAt||0)>(S.updatedAt||0)){ adopt(rem); r=null; }
      else r=await remotePut();
    }
    if(r){ if(!r.ok) throw new Error(r.status); sha=(await r.json()).content.sha; }
    syncState('Sincronizado','ok');
  }catch(e){ ok=false; dirty=true; syncState(errTxt(e),'err'); }
  pushing=false;
  if(ok && dirty) schedulePush();
}
async function syncPull(){
  if(!on()){ syncState(''); return; }
  if(dirty && !pushing) await syncPush();
  syncState('Sincronizando…');
  try{
    const rem=await remoteGet();
    if(!rem){ await syncPush(); return; }               // primera vez: sube lo que hay aquí
    const ra=rem.updatedAt||0, la=S.updatedAt||0;
    if(ra>la) adopt(rem);
    else if(la>ra){ await syncPush(); return; }
    syncState('Sincronizado','ok');
  }catch(e){ syncState(errTxt(e),'err'); }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') syncPull();
  else if(dirty) syncPush();
});

function renderHist(){
  let h=`<div class="hnav">
    <div class="seg"><button data-hmode="week" class="${hmode==='week'?'on':''}">Semana</button><button data-hmode="month" class="${hmode==='month'?'on':''}">Mes</button></div>
  </div>`;

function statsFor(keys){
  const tr=keys.filter(trained);
  const kc=keys.map(kcal).filter(x=>x>0);
  const hoy=iso(new Date()), past=keys.filter(k=>k<=hoy);
  const burns=past.map(k=>burn(k).total);
  const bals=keys.filter(k=>kcal(k)>0).map(k=>kcal(k)-burn(k).total);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  return {
    sessions:tr.length,
    vol:keys.reduce((a,k)=>a+dayVol(k),0),
    kcalAvg: avg(kc), kcalDays: kc.length,
    burnAvg: avg(burns), burnDays: burns.length,
    burnGym: past.reduce((a,k)=>{const b=burn(k); return a+b.pesas+b.cardio;},0),
    balAvg: avg(bals), balSum: bals.reduce((a,b)=>a+b,0), balDays: bals.length
  };
}
function histWeek(){
  const m=monday(href), keys=[...Array(7)].map((_,i)=>iso(add(m,i)));
  const st=statsFor(keys), w=weekWeight(keys[0]);
  const prevW=weekWeight(iso(add(m,-7)));
  let h=`<div class="hnav"><button class="btn icon" data-act="hPrev">‹</button><b>Semana del ${fmt(m)} al ${fmt(add(m,6))}</b><button class="btn icon" data-act="hNext">›</button></div>
  <div class="kpis">
    <div class="kpi"><small>Entrenamientos</small><b>${st.sessions}/5</b></div>
    <div class="kpi"><small>Volumen (${U()})</small><b>${nf(st.vol)}</b></div>
    <div class="kpi"><small>Peso corporal</small><b>${w?w+' '+U():'—'}</b>${w&&prevW?`<small>${(w-prevW>0?'+':'')+(Math.round((w-prevW)*10)/10)} vs. semana anterior</small>`:''}</div>
    <div class="kpi"><small>Quemadas en gym</small><b>${nf(st.burnGym)}</b></div>
    <div class="kpi"><small>Quemadas prom./día</small><b>${st.burnDays?nf(st.burnAvg):'—'}</b></div>
    <div class="kpi"><small>Consumidas prom./día</small><b>${st.kcalDays?nf(st.kcalAvg):'—'}</b></div>
    <div class="kpi"><small>Balance de la semana</small><b class="${st.balSum>0?'pos':'neg'}">${st.balDays?(st.balSum>0?'+':'')+nf(st.balSum):'—'}</b>${st.balDays?`<small>${st.balDays} día(s) con comidas</small>`:''}</div>
  </div><div class="card">`;
  keys.forEach(k=>{
    const d=parse(k), dow=d.getDay(), r=RUTINA[dow], data=get(k);
    const items=[];
    if(data){
      slots(dow).forEach(s=>{ const e=data.ex[s.id]; if(logged(e)) items.push(`${esc(e.n||S.names[s.id]||s.def||s.label)} <em>${setTxt(e)}</em>`); });
      Object.keys(data.ex||{}).forEach(id=>{ if(!id.startsWith('d'+dow+'-') && logged(data.ex[id])) items.push(`${esc(data.ex[id].n||id)} <em>${setTxt(data.ex[id])}</em>`); });
      (data.otros||[]).forEach(o=>{ if(logged(o)||(o.n||'').trim()) items.push(`${esc(o.n||'Otro')} <em>(otro) ${setTxt(o)}</em>`); });
    }
    const kc=kcal(k), bt = k<=iso(new Date()) ? burn(k) : null;
    const meta=[]; if(kc) meta.push('Comí '+nf(kc)); if(bt) meta.push('Quemé '+nf(bt.total)+(bt.pesas+bt.cardio>0?` (gym ${nf(bt.pesas+bt.cardio)})`:''));
    h+=`<div class="hday"><div class="top"><b>${DIAS_L[dow]} ${d.getDate()} · ${r?r.t:'Descanso'}</b><span>${meta.join(' · ')}</span></div>`;
    if(items.length) h+=`<ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    else h+=`<div class="muted" style="font-size:13px">${r?'Sin registro':'—'}</div>`;
    if(data&&data.notas) h+=`<div class="muted" style="font-size:13px;margin-top:4px">Nota: ${esc(data.notas)}</div>`;
    h+=`</div>`;
  });
  return h+`</div>`;
}
function histMonth(){
  const y=href.getFullYear(), mo=href.getMonth();
  const first=new Date(y,mo,1), last=new Date(y,mo+1,0);
  const keys=[]; for(let d=new Date(first); d<=last; d=add(d,1)) keys.push(iso(d));
  const st=statsFor(keys);
  const weights=[]; for(let d=monday(first); d<=last; d=add(d,7)){ if(d>=first){ const w=weekWeight(iso(d)); if(w) weights.push(w);} }
  let h=`<div class="hnav"><button class="btn icon" data-act="hPrev">‹</button><b style="text-transform:capitalize">${MESES[mo]} ${y}</b><button class="btn icon" data-act="hNext">›</button></div>
  <div class="kpis">
    <div class="kpi"><small>Entrenamientos</small><b>${st.sessions}</b></div>
    <div class="kpi"><small>Volumen (${U()})</small><b>${nf(st.vol)}</b></div>
    <div class="kpi"><small>Quemadas en gym</small><b>${nf(st.burnGym)}</b></div>
    <div class="kpi"><small>Consumidas prom./día</small><b>${st.kcalDays?nf(st.kcalAvg):'—'}</b></div>
    <div class="kpi"><small>Quemadas prom./día</small><b>${st.burnDays?nf(st.burnAvg):'—'}</b></div>
    <div class="kpi"><small>Balance del mes</small><b class="${st.balSum>0?'pos':'neg'}">${st.balDays?(st.balSum>0?'+':'')+nf(st.balSum):'—'}</b></div>
    <div class="kpi"><small>${weights.length>1?'Cambio de peso':'Peso corporal'}</small><b>${weights.length>1?((weights.at(-1)-weights[0]>0?'+':'')+Math.round((weights.at(-1)-weights[0])*10)/10+' '+U()):(weights.length?weights[0]+' '+U():'—')}</b></div>
  </div>
  <div class="card"><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="h">${x}</div>`).join('')}`;
  const lead=(first.getDay()+6)%7;
  for(let i=0;i<lead;i++) h+=`<div class="c empty"></div>`;
  keys.forEach(k=>{ const kc=kcal(k); h+=`<button class="c ${trained(k)?'t':''}" data-open="${k}">${parse(k).getDate()}${kc?`<span class="k">${nf(kc)}</span>`:''}</button>`; });
  h+=`</div><p class="muted" style="font-size:12px;margin:10px 0 0">Verde = día entrenado. Número pequeño = calorías del día. Toca un día para abrirlo.</p></div>
  <div class="card tablewrap"><h2>Por semana</h2><table><thead><tr><th>Semana</th><th>Entren.</th><th>Volumen</th><th>Kcal gym</th><th>Balance</th><th>Peso</th></tr></thead><tbody>`;
  for(let m=monday(first); m<=last; m=add(m,7)){
    const wk=[...Array(7)].map((_,i)=>iso(add(m,i)));
    const s=statsFor(wk), w=weekWeight(wk[0]);
    h+=`<tr><td>${m.getDate()} ${MESES[m.getMonth()].slice(0,3)}</td><td>${s.sessions}/5</td><td>${nf(s.vol)}</td><td>${nf(s.burnGym)}</td><td class="${s.balSum>0?'pos':'neg'}">${s.balDays?(s.balSum>0?'+':'')+nf(s.balSum):'—'}</td><td>${w?w:'—'}</td></tr>`;
  }
  return h+`</tbody></table></div>`;
}

  if(ds.name){ S.names[ds.name]=t.value; const d=get(cur); if(d&&d.ex[ds.name]) d.ex[ds.name].n=t.value; save(); return; }
  if(ds.otro!=null){ day(cur).otros[+ds.otro][ds.f]=t.value; save(); renderWeek(); updateBurn(); return; }
  if(ds.meal!=null){ day(cur).comidas[+ds.meal][ds.f]=t.value; save(); updateFood(); return; }
  if(t.id==='notas'){ day(cur).notas=t.value; save(); return; }
  if(t.id==='peso'){ day(cur).peso=t.value; save(); updateBurn(); return; }
  if(t.id==='goal'){ S.settings.goal=t.value; save(); updateFood(); return; }
});
document.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.id==='fecha' && t.value){ cur=t.value; render(); }
  if(t.id==='unit'){ S.settings.unit=t.value; save(); render(); }
  if(t.id==='file' && t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{ try{ const x=JSON.parse(rd.result); if(!x.days) throw 0; S=norm(x); save(); render(); }catch(e){ console.error('Archivo no válido'); } t.value=''; };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('click', ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const ds=b.dataset;
  if(ds.view){ view=ds.view; try{localStorage.setItem(KEY+'-view',view);}catch(e){} if(view==='hist') href=parse(cur); render(); return; }
  if(ds.go){ cur=ds.go; render(); return; }
  if(ds.open){ cur=ds.open; view='train'; render(); window.scrollTo(0,0); return; }
  if(ds.hmode){ hmode=ds.hmode; render(); return; }
  switch(ds.act){
    case 'prevDay': cur=iso(add(parse(cur),-1)); render(); break;
    case 'nextDay': cur=iso(add(parse(cur),1)); render(); break;
    case 'today': cur=iso(new Date()); render(); break;
    case 'addOtro': day(cur).otros.push({n:'',s:'',r:'',w:''}); save(); render(); { const l=document.querySelectorAll('[data-otro][data-f="n"]'); l[l.length-1]?.focus(); } break;
    case 'addCardio': { const d=day(cur); (d.cardio ||= []).push({i:'0',m:''}); save(); render(); const l=document.querySelectorAll('[data-cardio][data-f="m"]'); l[l.length-1]?.focus(); } break;
    case 'delCardio': day(cur).cardio.splice(+ds.i,1); save(); render(); break;
    case 'delOtro': day(cur).otros.splice(+ds.i,1); save(); render(); break;
    case 'addMeal': { const c=day(cur).comidas; c.push({t:ds.t,n:'',c:'',p:''}); save(); render(); document.querySelector(`[data-meal="${c.length-1}"][data-f="n"]`)?.focus(); } break;
    case 'delMeal': day(cur).comidas.splice(+ds.i,1); save(); render(); break;
    case 'hPrev': href = hmode==='week'? add(href,-7) : new Date(href.getFullYear(),href.getMonth()-1,1); render(); break;
    case 'hNext': href = hmode==='week'? add(href,7) : new Date(href.getFullYear(),href.getMonth()+1,1); render(); break;
    case 'export': {
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`mi-rutina-respaldo-${iso(new Date())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    } break;
    case 'import': $('#file').click(); break;
    case 'syncConnect': {
      const repo=($('#syRepo').value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
      const token=($('#syToken').value||'').trim();
      if(!repo.includes('/')||!token){ syncState('Falta el repositorio o el token','err'); break; }
      SY={repo,token}; try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){}
      render(); syncPull();
    } break;
    case 'syncNow': syncPull(); break;
    case 'syncOff': SY={}; try{ localStorage.removeItem(SKEY); }catch(e){} syncState(''); render(); break;
  }
});

render();
syncPull();
</script>
</body>
</html>
