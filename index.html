<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klauss Hartfiel</title>
<meta name="description" content="Sitio personal de Klauss Hartfiel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1b1c1a;--muted:#6c6b66;--line:#e3e1db;
  --accent:#1d7a4c;--accent-soft:#e2f1e8;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121311;--card:#1b1d1a;--ink:#ecebe6;--muted:#9b9a94;--line:#2c2e2a;--accent:#4cc38a;--accent-soft:#1c3226;}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 20px}
header{padding:28px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.mark{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.mark span{color:var(--accent)}
main{flex:1;display:flex;align-items:center}
.hero{padding:40px 0 80px}
.eyebrow{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:4px 12px;border-radius:999px;margin-bottom:22px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:clamp(40px,9vw,72px);line-height:1.02;letter-spacing:-.025em;margin:0 0 20px}
.lead{font-size:19px;color:var(--muted);max-width:520px;margin:0 0 32px}
.loc{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.loc i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
footer{border-top:1px solid var(--line);padding:22px 0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap"><a class="mark" href="/">Klauss Hartfiel<span>.</span></a></div>
</header>

<main>
  <div class="wrap hero">
    <div class="eyebrow">Sitio en construcción</div>
    <h1>Klauss Hartfiel</h1>
    <p class="lead">Bienvenido a mi sitio personal. Pronto encontrarás aquí más información sobre mi trabajo y mis proyectos.</p>
    <div class="loc"><i></i>Caracas, Venezuela</div>
  </div>
</main>

<footer>
  <div class="wrap">© <span id="y"></span> Klauss Hartfiel</div>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
